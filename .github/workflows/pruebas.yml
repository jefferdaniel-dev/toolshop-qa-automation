name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de las pruebas
        type: choice
        options: [search, cart, compra]
        default: search
      filtro:
        description: Filtro opcional de -k (por ejemplo, un producto). Las filas con login nunca corren.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://practicesoftwaretesting.com

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir la imagen
        run: docker build -t toolshop-qa .

      - name: Correr las pruebas
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FILTRO: ${{ inputs.filtro }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$INPUT_TAG" in
              search | cart | compra) ;;
              *) echo "Tag no permitido." >&2; exit 2 ;;
            esac
            filtro="${INPUT_FILTRO#"${INPUT_FILTRO%%[![:space:]]*}"}"
            filtro="${filtro%"${filtro##*[![:space:]]}"}"
            if [ -z "$filtro" ]; then
              keyword="not login"
            else
              if [ "${#filtro}" -gt 100 ] || ! [[ "$filtro" =~ ^[A-Za-z0-9\ _.()-]+$ ]]; then
                echo "Filtro no válido: solo letras, números, espacios y _ . ( ) -, hasta 100 caracteres." >&2
                exit 2
              fi
              depth=0
              for ((i = 0; i < ${#filtro}; i++)); do
                case "${filtro:i:1}" in
                  "(") depth=$((depth + 1)) ;;
                  ")") depth=$((depth - 1)) ;;
                esac
                if [ "$depth" -lt 0 ]; then break; fi
              done
              if [ "$depth" -ne 0 ]; then
                echo "Filtro no válido: paréntesis sin balancear." >&2
                exit 2
              fi
              keyword="not login and ($filtro)"
            fi
            args=(-m "$INPUT_TAG" -k "$keyword")
          else
            args=(-k "test_home or test_buscar")
          fi
          mkdir reports
          docker run --rm --user "$(id -u):$(id -g)" -e BASE_URL \
            -v "$PWD/reports:/app/reports" toolshop-qa "${args[@]}"

      - name: Armar el reporte Allure
        if: always()
        run: |
          npm ci --ignore-scripts
          python3 scripts/report.py

      - name: Subir el reporte
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-allure
          path: reports/*/informe/index.html
          retention-days: 7
          if-no-files-found: warn
